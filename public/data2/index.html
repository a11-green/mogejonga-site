<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <title>mogejonga - Data</title>
  <link rel="stylesheet" href="../css/layout.css">
  <style>
    /*
      9列グリッド共通定義
      col1: Game情報 / col2-5: A卓 / col6-9: B卓
    */
    .grid-9 {
      display: grid;
      grid-template-columns: 72px repeat(4, 1fr) repeat(4, 1fr);
    }

    /* ===== 固定ヘッダー ===== */
    .results-header {
      position: sticky;
      top: 0;
      z-index: 10;
      background: rgba(10, 30, 10, 0.97);
      border-bottom: 2px solid rgba(255, 255, 255, 0.2);
      margin-bottom: 6px;
      border-radius: 6px 6px 0 0;
    }

    .hdr-empty {
      /* Game列の空セル */
    }

    .hdr-tbl {
      text-align: center;
      font-weight: bold;
      font-size: 0.82em;
      letter-spacing: 3px;
      padding: 6px 4px 3px;
      color: #ddd;
    }
    .hdr-tbl.a {
      grid-column: span 4;
      border-right: 1px solid rgba(255, 255, 255, 0.18);
    }
    .hdr-tbl.b {
      grid-column: span 4;
    }

    .hdr-rank {
      text-align: center;
      font-size: 0.75em;
      font-weight: bold;
      padding: 2px 4px 7px;
    }
    .hdr-rank.a4 {
      border-right: 1px solid rgba(255, 255, 255, 0.18);
    }

    /* ===== ゲームカード ===== */
    .game-card {
      background: rgba(0, 0, 0, 0.38);
      border-radius: 6px;
      overflow: hidden;
      margin-bottom: 4px;
    }

    /* Game情報セル: 2行span */
    .game-info {
      grid-column: 1;
      grid-row: 1 / span 2;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 5px;
      padding: 6px 4px;
      border-right: 1px solid rgba(255, 255, 255, 0.15);
      text-align: center;
    }

    .game-num {
      font-weight: bold;
      font-size: 0.85em;
      line-height: 1.4;
    }

    .status-badge {
      font-size: 0.65em;
      padding: 2px 6px;
      border-radius: 4px;
      background: rgba(255, 255, 255, 0.15);
      letter-spacing: 1px;
    }
    .status-badge.sf { background: rgba(100, 160, 255, 0.3); }
    .status-badge.f  { background: rgba(255, 200, 50,  0.3); }

    /* プレイヤー名 */
    .pname {
      text-align: center;
      font-size: 0.9em;
      padding: 7px 4px 2px;
    }

    /* ポイント */
    .pt {
      text-align: center;
      font-family: monospace;
      font-size: 0.82em;
      padding: 2px 4px 7px;
    }
    .pos  { color: #7fc97f; }
    .neg  { color: #f88070; }
    .zero { color: #aaa; }

    /* A卓とB卓の境界線 */
    .a4 { border-right: 1px solid rgba(255, 255, 255, 0.15); }

    /* 着順色 */
    .rank-1 { color: #ffd700; }
    .rank-2 { color: #c0c0c0; }
    .rank-3 { color: #cd7f32; }
    .rank-4 { color: #777; }

    /* その他 */
    .year-selector { margin-bottom: 16px; }
    .placeholder   { text-align: center; color: #888; padding: 48px 0; }
    .loading-msg   { color: #aaa; padding: 10px 0; }
    .error-msg     { color: #f88; padding: 10px 0; }
  </style>
</head>
<body>
  <div class="header">
    <header>
      <ul class="header-list">
        <li><a href="../index.html"            class="link-to">Home</a></li>
        <li><a href="./index.html"             class="link-now">Data</a></li>
        <li><a href="../stats2/index.html"     class="link-to">Stats</a></li>
        <li><a href="../regulation/index.html" class="link-to">Regulation</a></li>
      </ul>
    </header>
  </div>

  <div class="contents">
    <div class="year-selector">
      <select onchange="loadYear(this.value)">
        <option value="">-- 年を選択 --</option>
        <option value="2016">2016</option>
        <option value="2017">2017</option>
        <option value="2018">2018</option>
        <option value="2019">2019</option>
        <option value="2020">2020</option>
        <option value="2021">2021</option>
        <option value="202205">2022前期</option>
        <option value="202212">2022後期</option>
        <option value="2023">2023</option>
        <option value="202406">2024前期</option>
        <option value="202412">2024後期</option>
      </select>
    </div>

    <div id="loading" class="loading-msg" style="display:none;">読み込み中...</div>
    <div id="error"   class="error-msg"   style="display:none;"></div>

    <!-- 着順ヘッダー（年選択後に表示） -->
    <div id="results-header" class="results-header grid-9" style="display:none;">
      <!-- 行1: 卓名ラベル -->
      <div class="hdr-empty"></div>
      <div class="hdr-tbl a">A 卓</div>
      <div class="hdr-tbl b">B 卓</div>
      <!-- 行2: 着順ラベル -->
      <div class="hdr-empty"></div>
      <div class="hdr-rank rank-1">1位</div>
      <div class="hdr-rank rank-2">2位</div>
      <div class="hdr-rank rank-3">3位</div>
      <div class="hdr-rank rank-4 a4">4位</div>
      <div class="hdr-rank rank-1">1位</div>
      <div class="hdr-rank rank-2">2位</div>
      <div class="hdr-rank rank-3">3位</div>
      <div class="hdr-rank rank-4">4位</div>
    </div>

    <div id="container">
      <div class="placeholder">年を選択してください</div>
    </div>
  </div>

  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore-compat.js"></script>
  <script>
    const firebaseConfig = {
      apiKey:            "AIzaSyAmCR3LPPTbwaGaZklCyvNpX-1ZrqN9dGg",
      authDomain:        "mogejonga-site.firebaseapp.com",
      projectId:         "mogejonga-site",
      storageBucket:     "mogejonga-site.firebasestorage.app",
      messagingSenderId: "544731021968",
      appId:             "1:544731021968:web:548739d70cf3c790c8ce15",
    };

    firebase.initializeApp(firebaseConfig);
    const db = firebase.firestore();

    async function loadYear(year) {
      const container  = document.getElementById("container");
      const header     = document.getElementById("results-header");
      const loading    = document.getElementById("loading");
      const errorEl    = document.getElementById("error");

      header.style.display = "none";
      container.innerHTML  = "";

      if (!year) {
        container.innerHTML = '<div class="placeholder">年を選択してください</div>';
        return;
      }

      loading.style.display = "block";
      errorEl.style.display = "none";

      try {
        const snapshot = await db.collection("gameResult")
          .where("year", "==", year)
          .get();

        const records = snapshot.docs.map(d => d.data());

        // ゲームNoでグルーピング
        const games = {};
        for (const r of records) {
          if (!games[r.game]) games[r.game] = { A: [], B: [], status: r.status };
          (r.groups === "A" ? games[r.game].A : games[r.game].B).push(r);
        }

        // ゲームNo昇順・各卓は着順でソート
        const gameNums = Object.keys(games).map(Number).sort((a, b) => a - b);
        for (const n of gameNums) {
          games[n].A.sort((a, b) => a.rank - b.rank);
          games[n].B.sort((a, b) => a.rank - b.rank);
        }

        // ヘッダー表示
        header.style.display = "grid";

        // ゲームカード生成
        const frag = document.createDocumentFragment();
        for (const n of gameNums) frag.appendChild(buildCard(n, games[n]));
        container.appendChild(frag);

      } catch (err) {
        errorEl.textContent = "エラー: " + err.message;
        errorEl.style.display = "block";
      } finally {
        loading.style.display = "none";
      }
    }

    function buildCard(gameNo, g) {
      const card = document.createElement("div");
      card.className = "game-card grid-9";

      // col1: Game情報（2行span）
      const statusKey = { SF: "sf", F: "f" }[g.status] || "";
      const info = document.createElement("div");
      info.className = "game-info";
      info.innerHTML = `
        <span class="game-num">Game<br>${gameNo}</span>
        <span class="status-badge ${statusKey}">${g.status}</span>
      `;
      card.appendChild(info);

      // 行1: 名前（A卓4列 → B卓4列）
      appendPlayerCells(card, g.A, g.B, "pname");

      // 行2: ポイント（A卓4列 → B卓4列）
      appendPlayerCells(card, g.A, g.B, "pt");

      return card;
    }

    function appendPlayerCells(card, aPlayers, bPlayers, type) {
      const isName = type === "pname";

      for (let i = 0; i < 4; i++) {
        const el  = document.createElement("div");
        const p   = aPlayers[i];
        const a4  = i === 3 ? " a4" : "";

        if (isName) {
          el.className = `pname${a4}`;
          el.textContent = p?.name ?? "—";
        } else {
          const cls = !p ? "zero" : p.point > 0 ? "pos" : p.point < 0 ? "neg" : "zero";
          el.className = `pt ${cls}${a4}`;
          el.textContent = p ? (p.point > 0 ? "+" : "") + p.point.toFixed(1) : "—";
        }
        card.appendChild(el);
      }

      for (let i = 0; i < 4; i++) {
        const el = document.createElement("div");
        const p  = bPlayers[i];

        if (isName) {
          el.className = "pname";
          el.textContent = p?.name ?? "—";
        } else {
          const cls = !p ? "zero" : p.point > 0 ? "pos" : p.point < 0 ? "neg" : "zero";
          el.className = `pt ${cls}`;
          el.textContent = p ? (p.point > 0 ? "+" : "") + p.point.toFixed(1) : "—";
        }
        card.appendChild(el);
      }
    }
  </script>
</body>
</html>
