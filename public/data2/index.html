<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <title>mogejonga - Data</title>
  <link rel="stylesheet" href="../css/layout.css">
  <style>
    /* ===== ゲームカード ===== */
    .games-grid {
      display: flex;
      flex-direction: column;
      gap: 6px;
    }

    /*
      6列グリッド:
        col1: Game No + Status (全6行をspan)
        col2: 卓名 (A卓 / B卓)
        col3-6: プレイヤー列 (1位〜4位)
    */
    .game-card {
      display: grid;
      grid-template-columns: 72px 48px repeat(4, 1fr);
      background: rgba(0, 0, 0, 0.45);
      border-radius: 8px;
      overflow: hidden;
    }

    /* ゲーム情報セル: 全6行span */
    .game-info {
      grid-column: 1;
      grid-row: 1 / span 6;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 6px;
      padding: 8px 4px;
      border-right: 1px solid rgba(255, 255, 255, 0.15);
      text-align: center;
    }

    .game-num {
      font-weight: bold;
      font-size: 0.9em;
      line-height: 1.3;
    }

    .status-badge {
      font-size: 0.68em;
      padding: 2px 7px;
      border-radius: 4px;
      background: rgba(255, 255, 255, 0.15);
      letter-spacing: 1px;
    }
    .status-badge.sf { background: rgba(100, 160, 255, 0.3); }
    .status-badge.f  { background: rgba(255, 200, 50,  0.3); }

    /* ===== 各セル共通 ===== */
    .cell {
      padding: 5px 6px;
      text-align: center;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    /* B卓の先頭行に区切り線 */
    .b-sep {
      border-top: 1px solid rgba(255, 255, 255, 0.12);
    }

    /* 卓名セル */
    .tbl-name {
      font-size: 0.8em;
      font-weight: bold;
      color: #aaa;
      letter-spacing: 2px;
      border-right: 1px solid rgba(255, 255, 255, 0.1);
      /* 卓名は3行分の高さを持つ (header + names + points) */
      grid-row: span 3;
      writing-mode: horizontal-tb;
    }

    /* 着順ヘッダー */
    .rank-hdr {
      font-size: 0.75em;
      font-weight: bold;
      padding-bottom: 4px;
      border-bottom: 1px solid rgba(255, 255, 255, 0.08);
    }
    .rank-1 { color: #ffd700; }
    .rank-2 { color: #c0c0c0; }
    .rank-3 { color: #cd7f32; }
    .rank-4 { color: #777; }

    /* プレイヤー名 */
    .pname {
      font-size: 0.95em;
    }

    /* ポイント */
    .pt {
      font-family: monospace;
      font-size: 0.85em;
      padding-top: 2px;
    }
    .pos  { color: #7fc97f; }
    .neg  { color: #f88070; }
    .zero { color: #ccc; }

    /* ===== その他 ===== */
    .year-selector { margin-bottom: 20px; }
    .placeholder   { text-align: center; color: #888; padding: 48px 0; }
    .loading-msg   { color: #aaa; padding: 10px 0; }
    .error-msg     { color: #f88; padding: 10px 0; }
  </style>
</head>
<body>
  <div class="header">
    <header>
      <ul class="header-list">
        <li><a href="../index.html"            class="link-to">Home</a></li>
        <li><a href="./index.html"             class="link-now">Data</a></li>
        <li><a href="../stats2/index.html"     class="link-to">Stats</a></li>
        <li><a href="../regulation/index.html" class="link-to">Regulation</a></li>
      </ul>
    </header>
  </div>

  <div class="contents">
    <div class="year-selector">
      <select onchange="loadYear(this.value)">
        <option value="">-- 年を選択 --</option>
        <option value="2016">2016</option>
        <option value="2017">2017</option>
        <option value="2018">2018</option>
        <option value="2019">2019</option>
        <option value="2020">2020</option>
        <option value="2021">2021</option>
        <option value="202205">2022前期</option>
        <option value="202212">2022後期</option>
        <option value="2023">2023</option>
        <option value="202406">2024前期</option>
        <option value="202412">2024後期</option>
      </select>
    </div>

    <div id="loading" class="loading-msg" style="display:none;">読み込み中...</div>
    <div id="error"   class="error-msg"   style="display:none;"></div>
    <div id="container">
      <div class="placeholder">年を選択してください</div>
    </div>
  </div>

  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore-compat.js"></script>
  <script>
    const firebaseConfig = {
      apiKey:            "AIzaSyAmCR3LPPTbwaGaZklCyvNpX-1ZrqN9dGg",
      authDomain:        "mogejonga-site.firebaseapp.com",
      projectId:         "mogejonga-site",
      storageBucket:     "mogejonga-site.firebasestorage.app",
      messagingSenderId: "544731021968",
      appId:             "1:544731021968:web:548739d70cf3c790c8ce15",
    };

    firebase.initializeApp(firebaseConfig);
    const db = firebase.firestore();

    // ===== データ取得 =====
    async function loadYear(year) {
      const container = document.getElementById("container");
      const loading   = document.getElementById("loading");
      const errorEl   = document.getElementById("error");

      if (!year) {
        container.innerHTML = '<div class="placeholder">年を選択してください</div>';
        return;
      }

      loading.style.display = "block";
      errorEl.style.display = "none";
      container.innerHTML = "";

      try {
        const snapshot = await db.collection("gameResult")
          .where("year", "==", year)
          .get();

        const records = snapshot.docs.map(d => d.data());

        // ゲームNoでグルーピング
        const games = {};
        for (const r of records) {
          if (!games[r.game]) games[r.game] = { A: [], B: [], status: r.status };
          (r.groups === "A" ? games[r.game].A : games[r.game].B).push(r);
        }

        // ゲームNo昇順、各卓は着順でソート
        const gameNums = Object.keys(games).map(Number).sort((a, b) => a - b);
        for (const n of gameNums) {
          games[n].A.sort((a, b) => a.rank - b.rank);
          games[n].B.sort((a, b) => a.rank - b.rank);
        }

        const grid = document.createElement("div");
        grid.className = "games-grid";
        for (const n of gameNums) grid.appendChild(buildCard(n, games[n]));
        container.appendChild(grid);

      } catch (err) {
        errorEl.textContent = "エラー: " + err.message;
        errorEl.style.display = "block";
      } finally {
        loading.style.display = "none";
      }
    }

    // ===== カード生成 =====
    function buildCard(gameNo, g) {
      const card = document.createElement("div");
      card.className = "game-card";

      // col1: Game No + Status (6行span はCSSで指定済み)
      const statusKey = { SF: "sf", F: "f" }[g.status] || "";
      const info = document.createElement("div");
      info.className = "game-info";
      info.innerHTML = `
        <span class="game-num">Game<br>${gameNo}</span>
        <span class="status-badge ${statusKey}">${g.status}</span>
      `;
      card.appendChild(info);

      // A卓・B卓の各行を追加
      appendTableRows(card, "A卓", g.A, false);
      appendTableRows(card, "B卓", g.B, true);

      return card;
    }

    const RANK_LABELS = ["", "1位", "2位", "3位", "4位"];

    function appendTableRows(card, label, players, isBTable) {
      const sep = isBTable ? " b-sep" : "";

      // --- 行1: 卓名 (3行span) + 着順ヘッダー ---
      const tblNameEl = document.createElement("div");
      tblNameEl.className = `cell tbl-name${sep}`;
      tblNameEl.textContent = label;
      card.appendChild(tblNameEl);

      for (let r = 1; r <= 4; r++) {
        const el = document.createElement("div");
        el.className = `cell rank-hdr rank-${r}${sep}`;
        el.textContent = RANK_LABELS[r];
        card.appendChild(el);
      }

      // --- 行2: プレイヤー名 ---
      for (let i = 0; i < 4; i++) {
        const el = document.createElement("div");
        el.className = "cell pname";
        el.textContent = players[i]?.name ?? "—";
        card.appendChild(el);
      }

      // --- 行3: ポイント ---
      for (let i = 0; i < 4; i++) {
        const el = document.createElement("div");
        if (players[i]) {
          const pt = players[i].point;
          const cls = pt > 0 ? "pos" : pt < 0 ? "neg" : "zero";
          el.className = `cell pt ${cls}`;
          el.textContent = (pt > 0 ? "+" : "") + pt.toFixed(1);
        } else {
          el.className = "cell pt zero";
          el.textContent = "—";
        }
        card.appendChild(el);
      }
    }
  </script>
</body>
</html>
