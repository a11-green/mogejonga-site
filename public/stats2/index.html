<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <title>mogejonga - Stats2</title>
  <link rel="stylesheet" href="../css/layout.css">
  <style>
    .loading {
      padding: 20px;
      font-size: 1.2em;
      color: #ccc;
    }
    .error {
      padding: 20px;
      color: #f88;
    }
    .table_stats th, .table_stats td {
      text-align: right;
      min-width: 60px;
    }
    .table_stats th:first-child, .table_stats td:first-child {
      text-align: left;
    }
    .total-row td {
      font-weight: bold;
      border-top: 2px solid #fff;
    }
  </style>
</head>
<body>
  <div class="header">
    <header>
      <ul class="header-list">
        <li><a href="../index.html" class="link-to">Home</a></li>
        <li><a href="../data/index.html" class="link-to">Data</a></li>
        <li><a href="../stats/index.html" class="link-to">Stats</a></li>
        <li><a href="./index.html" class="link-now">Stats2</a></li>
        <li><a href="../regulation/index.html" class="link-to">Regulation</a></li>
      </ul>
    </header>
  </div>

  <div class="contents">
    <h1>Stats2 <small style="font-size:0.5em; color:#aaa;">Firestore集計</small></h1>
    <div id="loading" class="loading">データを読み込み中...</div>
    <div id="error" class="error" style="display:none;"></div>

    <div id="stats-content" style="display:none;">

      <h2>予選得点</h2>
      <p style="color:#aaa; font-size:0.85em;">予選(status=Q)のpoint合計。NaN=不参加。</p>
      <div style="overflow-x:auto;">
        <table id="tbl-points" class="table_stats"></table>
      </div>

      <h2 style="margin-top:40px;">着順分布</h2>
      <p style="color:#aaa; font-size:0.85em;">予選の1〜4位回数と平均着順。</p>
      <div style="overflow-x:auto;">
        <table id="tbl-ranks" class="table_stats"></table>
      </div>

    </div>
  </div>

  <!-- Firebase SDK (compat) -->
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore-compat.js"></script>

  <script>
    // ----- Firebase設定 -----
    const firebaseConfig = {
      apiKey:            "AIzaSyAmCR3LPPTbwaGaZklCyvNpX-1ZrqN9dGg",
      authDomain:        "mogejonga-site.firebaseapp.com",
      projectId:         "mogejonga-site",
      storageBucket:     "mogejonga-site.firebasestorage.app",
      messagingSenderId: "544731021968",
      appId:             "1:544731021968:web:548739d70cf3c790c8ce15",
    };

    // ----- 年の表示順（時系列） -----
    const YEAR_ORDER = [
      "2016","2017","2018","2019","2020","2021",
      "202205","202212","2023","202406","202412",
    ];

    // ----- Firebase 初期化 -----
    firebase.initializeApp(firebaseConfig);
    const db = firebase.firestore();

    // ----- メイン処理 -----
    async function main() {
      try {
        // 予選レコードを全件取得
        const snapshot = await db.collection("gameResult")
          .where("status", "==", "Q")
          .get();

        const records = snapshot.docs.map(d => d.data());

        if (records.length === 0) {
          showError("Firestoreにデータがありません。addCSV.js でインポートしてください。");
          return;
        }

        // プレイヤー一覧（総対局数降順）
        const playerGameCount = {};
        for (const r of records) {
          playerGameCount[r.name] = (playerGameCount[r.name] || 0) + 1;
        }
        const players = Object.keys(playerGameCount)
          .sort((a, b) => playerGameCount[b] - playerGameCount[a]);

        // 実際に存在する年だけ、YEAR_ORDERの順で並べる
        const yearsInData = new Set(records.map(r => r.year));
        const years = YEAR_ORDER.filter(y => yearsInData.has(y));

        buildPointsTable(records, years, players);
        buildRanksTable(records, players);

        document.getElementById("loading").style.display = "none";
        document.getElementById("stats-content").style.display = "block";

      } catch (err) {
        showError("Firestore取得エラー: " + err.message);
      }
    }

    // ----- 予選得点テーブル -----
    function buildPointsTable(records, years, players) {
      // { year: { player: sum } }
      const pointMap = {};
      for (const r of records) {
        if (!pointMap[r.year]) pointMap[r.year] = {};
        pointMap[r.year][r.name] = ((pointMap[r.year][r.name] || 0) + r.point);
      }

      const table = document.getElementById("tbl-points");

      // ヘッダー行
      const thead = table.createTHead();
      const hrow = thead.insertRow();
      th(hrow, "year");
      for (const p of players) th(hrow, p);

      const tbody = table.createTBody();

      // 年ごとの行
      const playerTotal = {};
      for (const year of years) {
        const row = tbody.insertRow();
        td(row, year, true);
        for (const p of players) {
          const val = pointMap[year]?.[p];
          td(row, val !== undefined ? val.toFixed(1) : "NaN");
          if (val !== undefined) {
            playerTotal[p] = (playerTotal[p] || 0) + val;
          }
        }
      }

      // Total行
      const totalRow = tbody.insertRow();
      totalRow.classList.add("total-row");
      td(totalRow, "Total", true);
      for (const p of players) {
        const v = playerTotal[p];
        td(totalRow, v !== undefined ? v.toFixed(1) : "NaN");
      }
    }

    // ----- 着順分布テーブル -----
    function buildRanksTable(records, players) {
      // { player: { 1:n, 2:n, 3:n, 4:n, sum:n, count:n } }
      const rankMap = {};
      for (const r of records) {
        if (!rankMap[r.name]) rankMap[r.name] = { 1:0, 2:0, 3:0, 4:0, sum:0, count:0 };
        const ri = Math.round(r.rank);
        if (ri >= 1 && ri <= 4) {
          rankMap[r.name][ri]++;
          rankMap[r.name].sum += ri;
          rankMap[r.name].count++;
        }
      }

      const table = document.getElementById("tbl-ranks");

      const thead = table.createTHead();
      const hrow = thead.insertRow();
      th(hrow, "");
      th(hrow, "対局数");
      th(hrow, "1位");
      th(hrow, "2位");
      th(hrow, "3位");
      th(hrow, "4位");
      th(hrow, "平均着順");

      const tbody = table.createTBody();
      for (const p of players) {
        const d = rankMap[p] || { 1:0, 2:0, 3:0, 4:0, sum:0, count:0 };
        const avg = d.count > 0 ? (d.sum / d.count).toFixed(2) : "NaN";
        const row = tbody.insertRow();
        td(row, p, true);
        td(row, d.count);
        td(row, d[1]);
        td(row, d[2]);
        td(row, d[3]);
        td(row, d[4]);
        td(row, avg);
      }
    }

    // ----- DOM helpers -----
    function th(row, text) {
      const cell = document.createElement("th");
      cell.textContent = text;
      row.appendChild(cell);
    }
    function td(row, text, isHeader = false) {
      const cell = document.createElement(isHeader ? "th" : "td");
      cell.textContent = text;
      row.appendChild(cell);
    }

    function showError(msg) {
      document.getElementById("loading").style.display = "none";
      const el = document.getElementById("error");
      el.textContent = msg;
      el.style.display = "block";
    }

    main();
  </script>
</body>
</html>
