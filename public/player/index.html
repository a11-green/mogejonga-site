<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <title>mogejonga - Player</title>
  <link rel="stylesheet" href="../css/layout.css">
  <style>
    .loading { padding: 20px; font-size: 1.2em; color: #ccc; }
    .error   { padding: 20px; color: #f88; }

    .stat-cards {
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
      margin: 12px 0 8px;
    }
    .stat-card {
      background: rgba(255,255,255,0.08);
      border-radius: 8px;
      padding: 10px 18px;
      text-align: center;
      min-width: 80px;
    }
    .stat-card .label { font-size: 0.75em; color: #aaa; margin-bottom: 4px; }
    .stat-card .value { font-size: 1.35em; font-weight: bold; }
    .stat-card .sub   { font-size: 0.7em; color: #888; margin-top: 3px; }

    .rank-1 { color: #ffd700; }
    .rank-2 { color: #c0c0c0; }
    .rank-3 { color: #cd7f32; }
    .rank-4 { color: #777; }
    .pos    { color: #7fc97f; }
    .neg    { color: #f88070; }

    .table_stats th, .table_stats td {
      text-align: right;
      min-width: 90px;
      padding: 8px 16px;
    }
    .table_stats th:first-child, .table_stats td:first-child { text-align: left; }
    .total-row { font-weight: bold; border-top: 2px solid #fff; }

    .finals-cards {
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
      margin-top: 10px;
    }
    .final-card {
      background: rgba(255,200,50,0.12);
      border: 1px solid rgba(255,200,50,0.3);
      border-radius: 8px;
      padding: 8px 14px;
      text-align: center;
      min-width: 72px;
    }
    .final-card .fc-year  { font-size: 0.72em; color: #aaa; margin-bottom: 3px; }
    .final-card .fc-rank  { font-size: 1.2em; font-weight: bold; }
    .final-card .fc-pt    { font-size: 0.72em; color: #bbb; margin-top: 2px; }

    .opponent-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(180px, 1fr));
      gap: 12px;
      margin-top: 12px;
    }
    .opponent-card {
      background: rgba(255,255,255,0.08);
      border-radius: 8px;
      padding: 12px 16px;
    }
    .opponent-card .opp-label  { font-size: 0.75em; color: #aaa; margin-bottom: 5px; }
    .opponent-card .opp-name   { font-size: 1.15em; font-weight: bold; }
    .opponent-card .opp-detail { font-size: 0.78em; color: #bbb; margin-top: 3px; }

    .charts-row {
      display: flex;
      gap: 20px;
      align-items: flex-start;
      margin-top: 16px;
      flex-wrap: wrap;
    }

    .filter-bar {
      display: flex;
      align-items: center;
      gap: 16px;
      flex-wrap: wrap;
      margin: 16px 0 4px;
    }
    .filter-bar span { font-size: 0.85em; color: #aaa; }
    .filter-bar label {
      font-size: 0.9em;
      color: #ccc;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 5px;
    }

    #player-bio {
      background: rgba(255,255,255,0.05);
      border-left: 3px solid rgba(255,200,50,0.5);
      border-radius: 0 8px 8px 0;
      padding: 14px 18px;
      margin-bottom: 24px;
      font-size: 0.9em;
      line-height: 1.7;
      color: #ccc;
    }
    #player-bio:empty { display: none; }
  </style>
</head>
<body>
  <div class="header">
    <header>
      <ul class="header-list">
        <li><a href="../index.html"            class="link-to">Home</a></li>
        <li><a href="../data/index.html"       class="link-to">Data</a></li>
        <li><a href="../stats/index.html"      class="link-to">Stats</a></li>
        <li><a href="./index.html"             class="link-now">Player</a></li>
        <li><a href="../regulation/index.html" class="link-to">Regulation</a></li>
      </ul>
    </header>
  </div>

  <div class="contents">
    <h1>Player Stats</h1>
    <div id="loading-init" class="loading">データを読み込み中...</div>
    <div id="error" class="error" style="display:none;"></div>

    <div id="main-content" style="display:none;">
      <div style="margin-bottom:16px;">
        <select id="player-select" onchange="showPlayer(this.value)">
          <option value="">-- プレイヤーを選択 --</option>
        </select>
      </div>

      <div id="player-content" style="display:none;">

        <!-- 選手紹介 -->
        <div id="player-bio"></div>

        <!-- 決勝成績（フィルター対象外・常にF+A卓） -->
        <h2>決勝成績</h2>
        <div class="stat-cards" id="cards-finals-summary"></div>
        <div class="finals-cards" id="cards-finals-years"></div>

        <!-- 対局成績ヘッダー -->
        <h2 style="margin-top:32px;">対局成績</h2>

        <!-- フィルター -->
        <div class="filter-bar">
          <span>集計対象：</span>
          <label><input type="checkbox" id="chk-Q"  checked> 予選 (Q)</label>
          <label><input type="checkbox" id="chk-SF" checked> セミファイナル (SF)</label>
          <label><input type="checkbox" id="chk-F"> 決勝 (F)</label>
        </div>

        <!-- 着順 / 得点 summary cards -->
        <div class="stat-cards" id="cards-ranks"></div>
        <div class="stat-cards" id="cards-scores"></div>

        <!-- Charts -->
        <div class="charts-row">
          <div style="width:240px; flex-shrink:0;">
            <div style="position:relative; height:240px;">
              <canvas id="chart-ranks"></canvas>
            </div>
          </div>
          <div style="flex:1; min-width:260px;">
            <div style="position:relative; height:240px;">
              <canvas id="chart-scores"></canvas>
            </div>
          </div>
        </div>

        <!-- Yearly table -->
        <h2 style="margin-top:32px;">年度別成績</h2>
        <div style="overflow-x:auto;">
          <table id="tbl-yearly" class="table_stats"></table>
        </div>

        <!-- Opponents -->
        <h2 style="margin-top:32px;">対戦成績（50対局以上）</h2>
        <div class="opponent-grid" id="opponent-grid"></div>

      </div>
    </div>
  </div>

  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore-compat.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.4/dist/chart.umd.min.js"></script>
  <script>
    const firebaseConfig = {
      apiKey:            "AIzaSyAmCR3LPPTbwaGaZklCyvNpX-1ZrqN9dGg",
      authDomain:        "mogejonga-site.firebaseapp.com",
      projectId:         "mogejonga-site",
      storageBucket:     "mogejonga-site.firebasestorage.app",
      messagingSenderId: "544731021968",
      appId:             "1:544731021968:web:548739d70cf3c790c8ce15",
    };

    const CACHE_VERSION = "20000101000000"; // auto-updated by addCSV.js
    const CACHE_KEY     = "gameResult_v" + CACHE_VERSION;

    const YEAR_ORDER = [
      "2016","2017","2018","2019","2020","2021",
      "202205","202212","2023","202406","202412","2025",
    ];

    firebase.initializeApp(firebaseConfig);
    const db = firebase.firestore();

    let _allRecords  = [];
    let _chartRanks  = null;
    let _chartScores = null;

    // ── Init ──────────────────────────────────────────────────────────────────
    async function init() {
      try {
        for (const key of Object.keys(localStorage)) {
          if (key.startsWith("gameResult_v") && key !== CACHE_KEY) {
            localStorage.removeItem(key);
          }
        }
        const cached = localStorage.getItem(CACHE_KEY);
        if (cached) {
          _allRecords = JSON.parse(cached);
        } else {
          const snap = await db.collection("gameResult").get();
          _allRecords = snap.docs.map(d => d.data());
          try { localStorage.setItem(CACHE_KEY, JSON.stringify(_allRecords)); } catch(e) {}
        }

        const gameCnt = {};
        for (const r of _allRecords) gameCnt[r.name] = (gameCnt[r.name] || 0) + 1;
        const players = Object.keys(gameCnt).sort((a, b) => gameCnt[b] - gameCnt[a]);

        const sel = document.getElementById("player-select");
        for (const p of players) {
          const opt = document.createElement("option");
          opt.value = opt.textContent = p;
          sel.appendChild(opt);
        }

        ["chk-Q","chk-SF","chk-F"].forEach(id =>
          document.getElementById(id).addEventListener("change", () =>
            showPlayer(document.getElementById("player-select").value)
          )
        );

        document.getElementById("loading-init").style.display = "none";
        document.getElementById("main-content").style.display  = "block";
      } catch(err) {
        document.getElementById("loading-init").style.display = "none";
        const el = document.getElementById("error");
        el.textContent = "Firestore取得エラー: " + err.message;
        el.style.display = "block";
      }
    }

    // ── Player profiles ───────────────────────────────────────────────────────
    const PLAYER_PROFILES = {
      "近藤": "もじょじょんが史上最強の男。190局・4回優勝・決勝進出8回はすべてトップクラスの記録であり、総得点1230.9はダントツの1位。平均着順2.37・連帯率53.2%と攻守のバランスも申し分ない。冷静な読みと手堅いオーラス処理で勝ちを積み上げる職人肌の打ち手。「勝てる局面でしっかり勝つ」哲学を体現しているが、たまに見せるド直球の攻めが対局相手の戦略を根底から崩すことも。おそらく日常でも何気なく最適解を選んでいるタイプ——本人は「なんとなく」と言いそうだが、それは嘘だ。",

      "長屋": "安定感なら誰にも負けない鉄壁の守護神。185局で4着がわずか33回（17.8%）という圧倒的なラスト回避率を誇り、連帯率57.3%はグループ最高水準。優勝3回・決勝進出5回と実績も十分で、総得点995.9は全体2位。「絶対にラスを引かない男」として知られ、じわじわと相手を追い詰めるスタイルは砂漠の砂嵐のよう。失点をとにかく嫌う几帳面な性格が透けて見え、乱戦を好まないが土壇場の強さは折り紙付き。テスト前に絶対に徹夜をしないタイプ。",

      "浅野": "勝ちと負けを豪快に繰り返す波乱万丈プレイヤー。203局は全員中最多出場で、1着55回・4着57回というジェットコースター成績が攻めの姿勢を物語る。決勝進出7回と常連ながら優勝はまだ1回。「派手に勝って派手に散る」スタイルで、隣の席から聞こえる雄叫びと舌打ちの落差が大きいことで有名（推測）。とにかく場数が多く場慣れしているが、その経験値が決勝での爆発力につながりきっていないのが唯一の課題。",

      "枝松": "決勝の常連にして、あと一歩の男。184局・決勝進出6回・優勝2回は立派な実績だが、4着49回と荒れ場も少なくない二面性がある。予選では上位に食い込む実力があり、持越しでアドバンテージを作ることも多い。しかし決勝での勝率は控えめで、持越しリードを守りきれないシーンも目立つ。熱くなりやすい局面で「クールに見せようとして逆に空回りしている」姿が成績表から透けて見える気がする。",

      "菊地": "3着専門家、または自称「安全運転の達人」。180局で3着55回（30.6%）という驚異的な3着率は、ある意味で超安定志向の証明。しかし総得点-875.9という現実は、トップを狙わない代償の重さを容赦なく示している。決勝進出3回・優勝0回——賞圏内に踏み込む手前で満足してしまう癖があるのかもしれない。「まあ3着ならOKかな」とつぶやきながら、心のどこかで「なんで俺、1着取れないんだろう…」と思っているはず。",

      "諏訪": "バランスが良すぎるほどバランスが良いプレイヤー。165局で1着〜4着がほぼ均等（39/39/43/44）という分布は、ある意味で見事な安定感だが、逆に言えば「突出した強みがない」とも取れる。決勝進出4回・優勝0回——実力はあるのに最後に爆発しきれない。「むらがなさすぎる」という、褒めているのか貶しているのかよくわからない評価を受けているタイプ。人生でも「可もなく不可もなく」を標榜しているかもしれないが、それがちょっとした弱点かもしれない。",

      "土橋": "2着の帝王。152局で2着なんと48回（31.6%）という異次元の2着率は、麻雀の神様から「あなたはいつも惜しい」と言われているよう。連帯率54.6%は高水準で、決勝進出5回・優勝1回と実績もある。トップを取り切れないケースが多いながら、ラスも少なく極めて安定した連帯型プレイヤー。「なぜかあと一歩でトップを逃す日」に全員の共感を集めており、日常生活でも「惜しかった〜！」が口癖である可能性が高い。",

      "中山": "じわじわと実力を蓄える苦労人。149局で4着42回とやや苦しい局面も多く、総得点は-277.9。しかしそれでも決勝には2度顔を出しており、予選でのしぶとさは本物。全体的にやや受け身のスタイルで、自分のペースで打てる局は強いが外からプレッシャーをかけられると崩れやすいかもしれない。「気づいたら誰かの術中にはまっていた」系のキャラクターで、侮ると足をすくわれる隠れた実力者。",

      "落合": "麻雀界の不思議な安定感の持ち主。132局で1着わずか23回（17.4%）ながら、2着38回・3着41回と崩れずに立ち回れる実力はある。ラスも30回に抑えておりじりじりとした負けが多い印象。総得点-607.2は主に僅差の取りこぼしが積み重なった結果で、「あと少し」のシーンが多かったと思われる。対戦相手には存在感が薄く見えることもあるかもしれないが、油断すると想定外の手で刺されるタイプ。",

      "藤好": "32局・平均着順2.88と苦しいデータが並ぶが、4着13回と守りきれない局面が目立つ。まだまだ発展途上であり、経験を積めば数値は改善されるはず。逆境に強いタイプかどうかは、これからの対局で見えてくる。",

      "きんつ": "18局ながら1着7回・連帯率50%と上々の出だし。平均着順2.39は中堅以上のレベルで、決勝も1度経験済み。短期間のデータながら確実な実力を示しており、より多くの対局を経てさらに化けるかもしれない存在。",

      "三田村": "18局でまさかの平均着順2.22・連帯率61.1%はグループでもトップクラスの数値。サンプル数は少ないが、このペースを維持できれば常連組を脅かす脅威の新星。「え、なんか強くない？」という視線を集める存在になりつつある。",

      "森田": "16局・平均着順2.81とまだ苦戦中。大きな振れ幅を経験しながらスタイルを確立していく時期にある。これからに期待。",

      "植田": "16局・平均着順2.62。ほぼ平均的な滑り出しで、良い時と悪い時が混在している段階。自分の型を見つければ伸び代は十分。",

      "鎌田": "16局ながら連帯率68.8%という驚愕の数値を叩き出す連帯マシン。2着7回とほぼ毎回上位に食い込んでいるが、優勝はまだ0回。「1着が取れないことだけが悩み」という贅沢な課題を抱えている。",

      "仲": "14局・連帯率57.1%と良好な立ち上がり。データは少ないが、安定した成績を残せており今後のレギュラー参加に期待が集まる。",

      "長山": "14局・平均着順2.50とほぼ平均的な成績。まずは場数を踏んで自分のスタイルを確立していく段階。",
    };

    // ── Main entry ────────────────────────────────────────────────────────────
    function showPlayer(name) {
      const content = document.getElementById("player-content");
      if (!name) { content.style.display = "none"; return; }

      const allRecs = _allRecords.filter(r => r.name === name);
      if (!allRecs.length) { content.style.display = "none"; return; }

      const statuses = new Set();
      if (document.getElementById("chk-Q").checked)  statuses.add("Q");
      if (document.getElementById("chk-SF").checked) statuses.add("SF");
      if (document.getElementById("chk-F").checked)  statuses.add("F");
      const recs = allRecs.filter(r => statuses.has(r.status));

      content.style.display = "block";
      document.getElementById("player-bio").textContent = PLAYER_PROFILES[name] || "";
      buildFinalsSection(name);
      buildRankCards(recs);
      buildScoreCards(recs);
      buildYearlyTable(recs);
      buildOpponents(name);
      buildCharts(recs);
    }

    // ── Finals section (same logic as Stats computeChampions, unaffected by filter) ──
    function buildFinalsSection(name) {
      // Build Q+SF and F totals per year/player (same as Stats page computeChampions)
      const qsfMap = {};
      const fMap   = {};
      for (const r of _allRecords) {
        if (r.status === "Q" || r.status === "SF") {
          if (!qsfMap[r.year]) qsfMap[r.year] = {};
          qsfMap[r.year][r.name] = (qsfMap[r.year][r.name] || 0) + r.point;
        } else if (r.status === "F") {
          if (!fMap[r.year]) fMap[r.year] = {};
          fMap[r.year][r.name] = (fMap[r.year][r.name] || 0) + r.point;
        }
      }

      const summaryEl = document.getElementById("cards-finals-summary");
      const yearsEl   = document.getElementById("cards-finals-years");
      summaryEl.innerHTML = "";
      yearsEl.innerHTML   = "";

      // Find years where this player was in the top-4 Q+SF (same as Stats page computeChampions)
      const myFinalYears = [];
      const years = YEAR_ORDER.filter(y => _allRecords.some(r => r.year === y));

      for (const year of years) {
        const qsf  = qsfMap[year] || {};
        const f    = fMap[year]   || {};
        const hasF = Object.keys(f).length > 0;

        // Top 4 by Q+SF total
        const top4 = Object.entries(qsf)
          .sort((a, b) => b[1] - a[1])
          .slice(0, 4)
          .map(([n, qsfTotal]) => ({
            name:  n,
            // For F years: carryOver + F points (matches Stats page).
            // For non-F years (e.g. 2016): Q+SF total directly.
            total: hasF ? qsfTotal / 2 + (f[n] || 0) : qsfTotal,
          }));

        if (hasF) top4.sort((a, b) => b.total - a.total);

        const pos = top4.findIndex(fin => fin.name === name) + 1;
        if (pos > 0) {
          myFinalYears.push({ year, pos, total: top4[pos - 1].total, hasF });
        }
      }

      // "決勝進出" counts only years with an actual F round
      const finalCount = myFinalYears.filter(y => y.hasF).length;

      summaryEl.innerHTML = `
        <div class="stat-card">
          <div class="label">決勝進出</div>
          <div class="value">${finalCount}<span style="font-size:0.55em;font-weight:normal;"> 回</span></div>
        </div>`;

      if (!myFinalYears.length) {
        yearsEl.innerHTML = '<p style="color:#888;">上位入賞なし</p>';
        return;
      }

      const rankColors = ["rank-1","rank-2","rank-3","rank-4"];
      const ordinals   = ["","1st","2nd","3rd","4th"];
      for (const { year, pos, total, hasF } of myFinalYears) {
        const rankCls  = pos >= 1 && pos <= 4 ? rankColors[pos - 1] : "";
        const ordinal  = ordinals[pos] || (pos + "th");
        const subLabel = hasF ? "" : `<span style="font-size:0.6em;color:#888;margin-left:3px;">予選</span>`;
        yearsEl.innerHTML += `
          <div class="final-card">
            <div class="fc-year">${year}</div>
            <div class="fc-rank ${rankCls}">${ordinal}${subLabel}</div>
            <div class="fc-pt">${total >= 0 ? "+" : ""}${total.toFixed(1)}</div>
          </div>`;
      }
    }

    // ── Rank summary cards ────────────────────────────────────────────────────
    function buildRankCards(recs) {
      const cnt = {1:0, 2:0, 3:0, 4:0};
      let rankSum = 0, rankCnt = 0;
      for (const r of recs) {
        const ri = Math.round(r.rank);
        if (ri >= 1 && ri <= 4) { cnt[ri]++; rankSum += ri; rankCnt++; }
      }
      const avg = rankCnt > 0 ? (rankSum / rankCnt).toFixed(2) : "—";
      const avgColor = avg !== "—" ? (parseFloat(avg) < 2.5 ? "pos" : "neg") : "";

      const rentai     = rankCnt > 0 ? ((cnt[1] + cnt[2]) / rankCnt * 100).toFixed(1) : "—";
      const rentaiColor = rentai !== "—" ? (parseFloat(rentai) >= 50 ? "pos" : "neg") : "";

      document.getElementById("cards-ranks").innerHTML = `
        <div class="stat-card"><div class="label">1着</div><div class="value rank-1">${cnt[1]}</div></div>
        <div class="stat-card"><div class="label">2着</div><div class="value rank-2">${cnt[2]}</div></div>
        <div class="stat-card"><div class="label">3着</div><div class="value rank-3">${cnt[3]}</div></div>
        <div class="stat-card"><div class="label">4着</div><div class="value rank-4">${cnt[4]}</div></div>
        <div class="stat-card"><div class="label">対局数</div><div class="value">${rankCnt}</div></div>
        <div class="stat-card"><div class="label">平均着順</div><div class="value ${avgColor}">${avg}</div></div>
        <div class="stat-card"><div class="label">連帯率</div><div class="value ${rentaiColor}">${rentai !== "—" ? rentai + "%" : "—"}</div></div>
      `;
    }

    // ── Max/Min score cards ───────────────────────────────────────────────────
    function buildScoreCards(recs) {
      if (!recs.length) {
        document.getElementById("cards-scores").innerHTML = "";
        return;
      }
      let maxRec = recs[0], minRec = recs[0];
      for (const r of recs) {
        if (r.point > maxRec.point) maxRec = r;
        if (r.point < minRec.point) minRec = r;
      }
      const fmt    = r => (r.point >= 0 ? "+" : "") + r.point.toFixed(1);
      const detail = r => `${r.year} Game${r.game}`;

      document.getElementById("cards-scores").innerHTML = `
        <div class="stat-card">
          <div class="label">最高得点（1Game）</div>
          <div class="value pos">${fmt(maxRec)}</div>
          <div class="sub">${detail(maxRec)}</div>
        </div>
        <div class="stat-card">
          <div class="label">最低得点（1Game）</div>
          <div class="value neg">${fmt(minRec)}</div>
          <div class="sub">${detail(minRec)}</div>
        </div>
      `;
    }

    // ── Yearly table ──────────────────────────────────────────────────────────
    function buildYearlyTable(recs) {
      const years = YEAR_ORDER.filter(y => recs.some(r => r.year === y));
      const table = document.getElementById("tbl-yearly");
      table.innerHTML = "";

      const thead = table.createTHead();
      const hr = thead.insertRow();
      ["年度","対局数","得点","平均着順"].forEach(t => {
        const th = document.createElement("th"); th.textContent = t; hr.appendChild(th);
      });

      const tbody = table.createTBody();
      let totGames = 0, totPtSum = 0, totRankSum = 0;

      for (const year of years) {
        const yr   = recs.filter(r => r.year === year);
        const pt   = yr.reduce((s, r) => s + r.point, 0);
        const rnkS = yr.reduce((s, r) => s + r.rank, 0);
        totGames   += yr.length;
        totPtSum   += pt;
        totRankSum += rnkS;

        const avg = (rnkS / yr.length).toFixed(2);
        const tr = tbody.insertRow();
        cell(tr, year, true);
        cell(tr, yr.length);
        colorCell(tr, pt, v => (v>=0?"+":"") + v.toFixed(1));
        rankCell(tr, parseFloat(avg), avg);
      }

      const tr = tbody.insertRow();
      tr.classList.add("total-row");
      const totAvg = totGames > 0 ? (totRankSum / totGames).toFixed(2) : "—";
      cell(tr, "Total", true);
      cell(tr, totGames);
      colorCell(tr, totPtSum, v => (v>=0?"+":"") + v.toFixed(1));
      rankCell(tr, parseFloat(totAvg), totAvg);
    }

    // ── Opponents ─────────────────────────────────────────────────────────────
    function buildOpponents(name) {
      const tableMap = {};
      for (const r of _allRecords) {
        const key = `${r.year}_${r.game}_${r.groups}`;
        if (!tableMap[key]) tableMap[key] = [];
        tableMap[key].push(r);
      }

      const ptMap = {}, rnkMap = {};
      for (const group of Object.values(tableMap)) {
        const me = group.find(r => r.name === name);
        if (!me) continue;
        for (const q of group) {
          if (q.name === name) continue;
          ptMap[q.name]  = (ptMap[q.name] || 0) + me.point;
          if (!rnkMap[q.name]) rnkMap[q.name] = { sum: 0, count: 0 };
          rnkMap[q.name].sum   += me.rank;
          rnkMap[q.name].count += 1;
        }
      }

      const qualified = Object.keys(rnkMap).filter(p => rnkMap[p].count >= 50);
      const grid = document.getElementById("opponent-grid");
      grid.innerHTML = "";

      if (!qualified.length) {
        grid.innerHTML = '<p style="color:#888;grid-column:1/-1;">50対局以上の対戦相手なし</p>';
        return;
      }

      const avgOf   = p => rnkMap[p].sum / rnkMap[p].count;
      const bestPt  = qualified.reduce((b, p) => ptMap[p]  > ptMap[b]  ? p : b);
      const worstPt = qualified.reduce((b, p) => ptMap[p]  < ptMap[b]  ? p : b);
      const bestRnk  = qualified.reduce((b, p) => avgOf(p) < avgOf(b)  ? p : b);
      const worstRnk = qualified.reduce((b, p) => avgOf(p) > avgOf(b)  ? p : b);

      const fmtPt  = p => `${ptMap[p]>=0?"+":""}${ptMap[p].toFixed(1)}pt（${rnkMap[p].count}対局）`;
      const fmtRnk = p => `平均着順 ${avgOf(p).toFixed(2)}（${rnkMap[p].count}対局）`;

      const cards = [
        { label:"得意（得点）",  name: bestPt,   detail: fmtPt(bestPt),    cls:"pos" },
        { label:"得意（着順）",  name: bestRnk,  detail: fmtRnk(bestRnk),  cls:"pos" },
        { label:"苦手（得点）",  name: worstPt,  detail: fmtPt(worstPt),   cls:"neg" },
        { label:"苦手（着順）",  name: worstRnk, detail: fmtRnk(worstRnk), cls:"neg" },
      ];
      for (const c of cards) {
        grid.innerHTML += `
          <div class="opponent-card">
            <div class="opp-label">${c.label}</div>
            <div class="opp-name ${c.cls}">${c.name}</div>
            <div class="opp-detail">${c.detail}</div>
          </div>`;
      }
    }

    // ── Charts ────────────────────────────────────────────────────────────────
    function buildCharts(recs) {
      if (_chartRanks)  { _chartRanks.destroy();  _chartRanks  = null; }
      if (_chartScores) { _chartScores.destroy(); _chartScores = null; }

      // Pie: rank distribution
      const cnt = {1:0, 2:0, 3:0, 4:0};
      for (const r of recs) { const ri = Math.round(r.rank); if (ri>=1&&ri<=4) cnt[ri]++; }

      _chartRanks = new Chart(document.getElementById("chart-ranks"), {
        type: "pie",
        data: {
          labels: ["1着","2着","3着","4着"],
          datasets: [{
            data: [cnt[1], cnt[2], cnt[3], cnt[4]],
            backgroundColor: ["rgba(255,215,0,0.75)","rgba(192,192,192,0.75)","rgba(205,127,50,0.75)","rgba(119,119,119,0.75)"],
            borderColor:     ["#ffd700","#c0c0c0","#cd7f32","#777"],
            borderWidth: 1,
          }],
        },
        options: {
          responsive: true, maintainAspectRatio: false,
          plugins: {
            title:  { display: true, text: "着順分布", color: "#ddd", font: { size: 13 } },
            legend: { labels: { color: "#ccc", boxWidth: 14 } },
          },
        },
      });

      // Bar + Line: yearly + cumulative — single y-axis (0 aligned)
      const years = YEAR_ORDER.filter(y => recs.some(r => r.year === y));
      let cum = 0;
      const yearlyPt = [], cumPt = [];
      for (const y of years) {
        const pt = recs.filter(r => r.year === y).reduce((s, r) => s + r.point, 0);
        cum += pt;
        yearlyPt.push(parseFloat(pt.toFixed(1)));
        cumPt.push(parseFloat(cum.toFixed(1)));
      }

      _chartScores = new Chart(document.getElementById("chart-scores"), {
        data: {
          labels: years,
          datasets: [
            {
              type: "bar",
              label: "年度別得点",
              data: yearlyPt,
              backgroundColor: yearlyPt.map(v => v >= 0 ? "rgba(127,201,127,0.55)" : "rgba(248,128,112,0.55)"),
              borderColor:     yearlyPt.map(v => v >= 0 ? "#7fc97f" : "#f88070"),
              borderWidth: 1,
              order: 2,
            },
            {
              type: "line",
              label: "累積得点",
              data: cumPt,
              borderColor: "#4e79a7",
              backgroundColor: "rgba(78,121,167,0.12)",
              tension: 0,
              pointRadius: 4,
              pointHoverRadius: 6,
              borderWidth: 2,
              order: 1,
            },
          ],
        },
        options: {
          responsive: true, maintainAspectRatio: false,
          plugins: {
            title:  { display: true, text: "年度別得点 / 累積得点", color: "#ddd", font: { size: 13 } },
            legend: { labels: { color: "#ccc", boxWidth: 14 } },
          },
          scales: {
            x: { ticks: { color: "#aaa" }, grid: { color: "rgba(255,255,255,0.07)" } },
            y: { ticks: { color: "#aaa" }, grid: { color: "rgba(255,255,255,0.07)" },
                 beginAtZero: false },
          },
        },
      });
    }

    // ── Helpers ───────────────────────────────────────────────────────────────
    function cell(row, text, isHeader = false) {
      const el = document.createElement(isHeader ? "th" : "td");
      el.textContent = text;
      row.appendChild(el);
      return el;
    }
    function colorCell(row, val, fmt) {
      const el = cell(row, fmt(val));
      el.style.color = val > 0 ? "#7fc97f" : val < 0 ? "#f88070" : "";
      return el;
    }
    function rankCell(row, avg, text) {
      const el = cell(row, text);
      if (!isNaN(avg)) el.style.color = avg < 2.5 ? "#7fc97f" : avg > 2.5 ? "#f88070" : "";
      return el;
    }

    init();
  </script>
</body>
</html>
