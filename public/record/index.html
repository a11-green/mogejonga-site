<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>mogejonga — 記録</title>
  <link rel="stylesheet" href="../css/layout.css">
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.4/dist/chart.umd.min.js"></script>
  <style>
    /* ── sub-header ── */
    .rec-subhdr {
      display: flex; align-items: center; justify-content: space-between;
      padding: 7px 14px;
      border-bottom: 1px solid rgba(255,255,255,0.08);
      background: rgba(0,0,0,0.25);
    }
    .rec-subhdr-title { font-size: .9rem; font-weight: bold; color: rgba(255,200,50,.9); }
    .rec-subhdr-right { display: flex; align-items: center; gap: 8px; }
    .btn-sm {
      display: inline-flex; align-items: center; gap: 4px;
      padding: 4px 10px;
      background: rgba(255,255,255,.07);
      border: 1px solid rgba(255,255,255,.18);
      border-radius: 5px; color: #ccc; text-decoration: none;
      font-size: .75rem; white-space: nowrap; cursor: pointer;
    }
    .btn-sm:hover { background: rgba(255,255,255,.13); color: #fff; }
    .btn-sm:disabled { opacity: .4; cursor: default; }

    /* ── raw sheet table ── */
    .sheet-wrap {
      width: 100%; overflow-x: auto; max-height: 480px; overflow-y: auto;
      border-bottom: 1px solid rgba(255,255,255,.07);
      background: rgba(0,0,0,.2);
    }
    @media (max-width: 560px) { .sheet-wrap { max-height: 320px; } }

    .raw-table { border-collapse: collapse; font-size: .78rem; white-space: nowrap; }
    .raw-table td {
      padding: 3px 8px; border: 1px solid rgba(255,255,255,.08);
      min-width: 52px; text-align: right; color: #ccc;
    }
    .raw-table td.rt-a {
      text-align: left; background: rgba(255,255,255,.03);
      color: #888; min-width: 44px; position: sticky; left: 0;
    }
    .raw-table tr.rt-names td { background: rgba(255,200,50,.12); color: rgba(255,200,50,.9); font-weight: bold; text-align: center; }
    .raw-table tr.rt-names td.rt-a { color: #777; background: rgba(255,255,255,.03); }
    .raw-table tr.rt-game:nth-child(even) td { background: rgba(255,255,255,.02); }
    .raw-table tr.rt-game:nth-child(even) td.rt-a { background: rgba(255,255,255,.04); }
    .raw-table tr.rt-summary td { background: rgba(79,195,247,.07); color: #90caf9; font-weight: bold; }
    .raw-table tr.rt-summary td.rt-a { color: #90caf9; }
    .raw-table td.rt-pos { color: #a5d6a7; }
    .raw-table td.rt-neg { color: #ef9a9a; }
    .raw-table td.rt-zero { color: #555; }
    .raw-table td.rt-check { color: #555; border-left: 2px solid rgba(255,255,255,.12); }

    /* ── main content area ── */
    .rec-body { max-width: 960px; margin: 0 auto; padding: 12px 14px 40px; }

    /* ── panels row ── */
    .panels { display: grid; grid-template-columns: 1fr; gap: 12px; margin-bottom: 14px; }
    .panel {
      background: rgba(255,255,255,.04);
      border: 1px solid rgba(255,255,255,.09);
      border-radius: 10px; padding: 12px;
    }
    .panel-title { font-size: .75rem; color: #aaa; margin-bottom: 8px; letter-spacing: .04em; text-transform: uppercase; }

    /* 次の対局 */
    .next-game-label {
      font-size: .85rem; font-weight: bold; color: rgba(255,200,50,.9);
      margin-bottom: 8px;
    }
    .table-group { display: flex; align-items: flex-start; gap: 6px; margin-bottom: 5px; }
    .tg-badge {
      display: inline-block; font-size: .7rem; font-weight: bold;
      padding: 2px 7px; border-radius: 4px; white-space: nowrap; margin-top: 1px;
    }
    .tg-badge.a { background: rgba(79,195,247,.2); color: #4fc3f7; border: 1px solid rgba(79,195,247,.3); }
    .tg-badge.b { background: rgba(129,199,132,.2); color: #81c784; border: 1px solid rgba(129,199,132,.3); }
    .tg-badge.bye { background: rgba(200,200,200,.1); color: #999; border: 1px solid rgba(200,200,200,.15); }
    .tg-names { font-size: .88rem; line-height: 1.5; color: #ddd; }

    /* 決勝出場ライン */
    .finalist-row {
      display: flex; align-items: center; justify-content: space-between;
      padding: 5px 0; border-bottom: 1px solid rgba(255,255,255,.06);
      font-size: .88rem;
    }
    .finalist-row:last-child { border-bottom: none; }
    .finalist-row.in-line { color: #ffd700; }
    .finalist-row.border-line { color: #aaa; border-top: 1px dashed rgba(255,215,0,.3); margin-top: 4px; padding-top: 8px; }
    .finalist-rank { font-weight: bold; width: 24px; flex-shrink: 0; }
    .finalist-name { flex: 1; padding: 0 6px; }
    .finalist-score { font-size: .82rem; color: #aaa; }
    .finalist-row.in-line .finalist-score { color: rgba(255,215,0,.7); }

    /* ── standings ── */
    .section-title {
      font-size: .8rem; font-weight: bold; color: #aaa;
      letter-spacing: .06em; text-transform: uppercase;
      margin-bottom: 8px; margin-top: 14px;
    }
    .standings-wrap { overflow-x: auto; }
    table.standings {
      width: 100%; border-collapse: collapse; font-size: .82rem; white-space: nowrap;
    }
    table.standings th {
      background: rgba(255,255,255,.05); color: #aaa;
      padding: 6px 8px; text-align: center; border-bottom: 1px solid rgba(255,255,255,.1);
      font-weight: normal;
    }
    table.standings td { padding: 6px 8px; text-align: center; border-bottom: 1px solid rgba(255,255,255,.05); }
    table.standings tr.finalist-tr td { color: #ffd700; }
    table.standings tr.finalist-tr td.name-td { font-weight: bold; }
    table.standings td.name-td { text-align: left; }
    .medal { font-size: .95rem; }

    /* ── chart ── */
    .chart-header { display: flex; align-items: center; justify-content: space-between; margin-bottom: 8px; }
    .chart-wrap {
      background: rgba(255,255,255,.03);
      border: 1px solid rgba(255,255,255,.07);
      border-radius: 10px; padding: 12px;
    }
    .status-bar { font-size: .78rem; color: #888; text-align: center; padding: 6px 0 0; }
    .status-bar.err { color: #ef5350; }
  </style>
</head>
<body>

<!-- nav -->
<div class="header">
  <header>
    <ul class="header-list">
      <li><a href="../index.html"            class="link-to">Home</a></li>
      <li><a href="../data/index.html"       class="link-to">Data</a></li>
      <li><a href="../stats/index.html"      class="link-to">Stats</a></li>
      <li><a href="../ranking/index.html"    class="link-to">Ranking</a></li>
      <li><a href="../player/index.html"     class="link-to">Player</a></li>
      <li><a href="./index.html"             class="link-now">Record</a></li>
      <li><a href="../regulation/index.html" class="link-to">Regulation</a></li>
    </ul>
  </header>
</div>

<!-- sub-header -->
<div class="rec-subhdr">
  <span class="rec-subhdr-title">当日成績表</span>
  <div class="rec-subhdr-right">
    <button class="btn-sm" id="btn-refresh" onclick="loadAll()">↺ 更新</button>
    <a class="btn-sm"
       href="https://docs.google.com/spreadsheets/d/e/2PACX-1vQxtQ4FX1Yfg70tLIGiGYo2VrbM0Vu4BTBrdTYJMIeOWacVyvAHiNO6KOpW7PmY9xV4KcLYb1O2k1Mk/pubhtml"
       target="_blank" rel="noopener">↗ 別タブで開く</a>
  </div>
</div>

<!-- embedded sheet (JS-rendered from CSV) -->
<div class="sheet-wrap">
  <div id="raw-sheet-table" style="padding:4px 0"></div>
</div>

<!-- dynamic content -->
<div class="rec-body">

  <!-- panels -->
  <div class="panels">
    <!-- 次の対局 -->
    <div class="panel">
      <div class="panel-title">次の対局</div>
      <div id="next-game-body"><span style="color:#666;font-size:.85rem">読み込み中…</span></div>
    </div>
  </div>

  <!-- standings -->
  <div class="section-title">順位表</div>
  <div class="standings-wrap">
    <table class="standings">
      <thead><tr>
        <th>#</th><th class="name-td" style="text-align:left">名前</th>
        <th>小計</th><th>持越</th><th>決1</th><th>決2</th><th>合計</th>
      </tr></thead>
      <tbody id="standings-body"></tbody>
    </table>
  </div>

  <!-- chart -->
  <div class="chart-header" style="margin-top:18px">
    <div class="section-title" style="margin:0">ポイント推移グラフ</div>
  </div>
  <div class="chart-wrap">
    <canvas id="scoreChart"></canvas>
  </div>
  <div class="status-bar" id="status-bar">読み込み中…</div>

</div><!-- /rec-body -->

<script>
// ── Schedule (1-indexed seat numbers) ──────────────────────────
const SCHEDULE = [
  {a:[1,2,3,4],b:[5,6,7,8],bye:9},
  {a:[1,2,5,6],b:[3,4,7,9],bye:8},
  {a:[1,2,8,9],b:[3,4,5,6],bye:7},
  {a:[1,4,5,9],b:[2,3,7,8],bye:6},
  {a:[1,4,7,8],b:[2,3,6,9],bye:5},
  {a:[1,3,6,8],b:[2,5,7,9],bye:4},
  {a:[1,6,7,9],b:[2,4,5,8],bye:3},
  {a:[1,3,5,7],b:[4,6,8,9],bye:2},
  {a:[2,4,6,7],b:[3,5,8,9],bye:1},
  {a:[1,2,3,4],b:[5,6,7,8],bye:9},
  {a:[1,2,5,6],b:[3,4,7,9],bye:8},
  {a:[1,2,8,9],b:[3,4,5,6],bye:7},
  {a:[1,4,5,9],b:[2,3,7,8],bye:6},
  {a:[1,4,7,8],b:[2,3,6,9],bye:5},
  {a:[1,3,6,8],b:[2,5,7,9],bye:4},
  {a:[1,6,7,9],b:[2,4,5,8],bye:3},
  {a:[1,3,5,7],b:[4,6,8,9],bye:2},
  {a:[2,4,6,7],b:[3,5,8,9],bye:1},
];

const COLORS = [
  '#ef5350','#42a5f5','#66bb6a','#ffa726',
  '#ab47bc','#26c6da','#d4e157','#ff7043','#8d6e63'
];

// CSV URL — no gid (uses default/first sheet), no range restriction
// Column slice(1,10) in parsing already limits to B-J
const CSV_BASE =
  'https://docs.google.com/spreadsheets/d/e/' +
  '2PACX-1vQxtQ4FX1Yfg70tLIGiGYo2VrbM0Vu4BTBrdTYJMIeOWacVyvAHiNO6KOpW7PmY9xV4KcLYb1O2k1Mk' +
  '/pub?single=true&output=csv';

let chartInst = null;

// ── CSV parser ──────────────────────────────────────────────────
function parseCSV(text) {
  // Split lines; handle \r\n and \n
  return text.trim().split(/\r?\n/).map(line => {
    // Simple split — values in this sheet don't contain commas
    return line.split(',').map(c => c.trim().replace(/^"|"$/g, ''));
  });
}

// ── Sheet data extractor ────────────────────────────────────────
function extractData(rows) {
  // 1. Identify the first game row (col A = integer "1")
  //    and find the contiguous block of game rows (1..N)
  let firstGameRow = -1;
  for (let i = 0; i < rows.length; i++) {
    const a = rows[i][0];
    if (parseInt(a, 10) === 1 && String(parseInt(a,10)) === a) {
      firstGameRow = i; break;
    }
  }
  if (firstGameRow === -1) return null;

  // Collect game rows in sequence
  const gameRows = [];
  for (let i = firstGameRow; i < rows.length; i++) {
    const n = Number(rows[i][0]);
    if (Number.isInteger(n) && n >= 1 && n <= 18) {
      // cells B..J (indices 1..9) are the player scores
      gameRows.push({ gameNum: n, cells: rows[i].slice(1, 10) });
    }
  }
  // Sort by game number (should already be sorted)
  gameRows.sort((a, b) => a.gameNum - b.gameNum);

  // 2. Player names: look for the row just before firstGameRow
  //    that contains non-numeric strings — these are the names (seats 1-9).
  //    We look backward from firstGameRow - 1.
  let names = null;
  for (let i = firstGameRow - 1; i >= 0; i--) {
    const candidates = rows[i].slice(1, 10).filter(c => c !== '' && isNaN(Number(c)));
    if (candidates.length >= 5) {
      // Use the 9 cells in B..J, keeping empties to preserve seat alignment
      names = rows[i].slice(1, 10).map(c => c.trim());
      break;
    }
  }
  // Fallback: try the row at firstGameRow - 2
  if (!names) {
    for (let i = 0; i < firstGameRow; i++) {
      const slice = rows[i].slice(1, 10);
      if (slice.filter(c => c !== '' && isNaN(Number(c))).length >= 5) {
        names = slice.map(c => c.trim()); break;
      }
    }
  }
  if (!names) return null;

  // 3. 小計 / 持越 / 決1 / 決2 / 合計 rows
  const findRow = label => {
    for (const row of rows) {
      if (row[0].trim() === label)
        return row.slice(1, 10).map(v => v.trim() === '' ? null : parseFloat(v));
    }
    return null;
  };

  return {
    names,               // length 9; names[i] = player at seat i+1
    gameRows,            // [{gameNum, cells:[9 strings]}]
    subtotals: findRow('小計'),
    carryover: findRow('持越'),
    final1:    findRow('決1'),
    final2:    findRow('決2'),
    totals:    findRow('合計'),
  };
}

// ── Determine completed game count ─────────────────────────────
// 試合は順番に進む前提。絶対値合計 > 0 なら得点入力済み。
// 空セル（抜け番）は 0 扱いなので、全員 0 のゲームは未実施と判定。
function completedGames(gameRows) {
  let count = 0;
  for (const g of gameRows) {
    const absSum = g.cells.reduce((s, v) => {
      const n = parseFloat(v);
      return s + (isNaN(n) ? 0 : Math.abs(n));
    }, 0);
    if (absSum > 0.001) count++;
    else break; // 最初の未実施ゲームで打ち切り
  }
  return count;
}

// ── Render: Raw sheet table (A1:K25) ──────────────────────────
function escHtml(s) {
  return s.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
}

function renderRawTable(rows) {
  const el = document.getElementById('raw-sheet-table');
  const SUMMARY = new Set(['小計','持越','決1','決2','合計']);
  let html = '<table class="raw-table"><tbody>';

  for (const row of rows.slice(0, 25)) {
    const cells = row.slice(0, 11); // A-K
    const colA  = (cells[0] ?? '').trim();
    const isGame    = /^\d+$/.test(colA) && +colA >= 1 && +colA <= 18;
    const isSummary = SUMMARY.has(colA);
    const isNames   = !isGame && !isSummary &&
                      cells.slice(1, 10).filter(c => c && isNaN(Number(c))).length >= 5;

    const rowCls = isNames ? 'rt-names' : isSummary ? 'rt-summary' : isGame ? 'rt-game' : 'rt-other';
    html += `<tr class="${rowCls}">`;

    cells.forEach((cell, ci) => {
      const val = (cell ?? '').trim();
      let cls = ci === 0 ? 'rt-a' : '';
      if (ci >= 1 && ci <= 9 && val !== '') {
        const n = parseFloat(val);
        if (!isNaN(n)) cls += n > 0 ? ' rt-pos' : n < 0 ? ' rt-neg' : ' rt-zero';
      }
      if (ci === 10) cls += ' rt-check';
      html += `<td class="${cls.trim()}">${escHtml(val)}</td>`;
    });
    html += '</tr>';
  }

  html += '</tbody></table>';
  el.innerHTML = html;
}

// ── Render: 次の対局 ───────────────────────────────────────────
function renderNextGame(data) {
  const el = document.getElementById('next-game-body');
  const done = completedGames(data.gameRows);

  if (done >= 18) {
    el.innerHTML = `<div style="color:#81c784;font-weight:bold">予選終了</div>`;
    return;
  }

  const gi = done; // 0-indexed → SCHEDULE[gi] is the next game
  const g  = SCHEDULE[gi];
  const p  = data.names; // p[i] = name at seat i+1; p[seatNum-1] = name

  const nameList = seats => seats.map(s => p[s - 1] || `座席${s}`).join('　');

  el.innerHTML = `
    <div class="next-game-label">G${gi + 1} / 18</div>
    <div class="table-group">
      <span class="tg-badge a">A卓</span>
      <span class="tg-names">${nameList(g.a)}</span>
    </div>
    <div class="table-group">
      <span class="tg-badge b">B卓</span>
      <span class="tg-names">${nameList(g.b)}</span>
    </div>
    <div class="table-group">
      <span class="tg-badge bye">抜け番</span>
      <span class="tg-names" style="color:#888">${p[g.bye - 1] || `座席${g.bye}`}</span>
    </div>`;
}

// ── Render: 決勝出場ライン ─────────────────────────────────────
function renderFinalists(data) {
  const el = document.getElementById('finalist-body');
  if (!data.subtotals) {
    el.innerHTML = `<span style="color:#666;font-size:.85rem">データなし</span>`; return;
  }
  const ranks = data.names
    .map((name, i) => ({ name, sub: data.subtotals[i] ?? 0 }))
    .sort((a, b) => b.sub - a.sub);

  const medals = ['🥇','🥈','🥉','4'];
  el.innerHTML = ranks.map((r, i) => {
    const cls = i < 4 ? (i === 3 ? 'in-line border-line' : 'in-line') : '';
    return `<div class="finalist-row ${cls}">
      <span class="finalist-rank">${medals[i] ?? i + 1}</span>
      <span class="finalist-name">${r.name}</span>
      <span class="finalist-score">${r.sub.toFixed(1)}</span>
    </div>`;
  }).join('');
}

// ── Render: 順位表 ─────────────────────────────────────────────
function renderStandings(data) {
  const tbody = document.getElementById('standings-body');
  if (!data.subtotals) { tbody.innerHTML = ''; return; }

  const rows = data.names.map((name, i) => {
    const sub = data.subtotals?.[i] ?? 0;
    const car = data.carryover?.[i] ?? (sub / 2);
    const f1  = data.final1?.[i];
    const f2  = data.final2?.[i];
    const tot = data.totals?.[i] ?? (car + (f1 ?? 0) + (f2 ?? 0));
    return { name, sub, car, f1, f2, tot };
  }).sort((a, b) => b.tot - a.tot || b.sub - a.sub);

  const medals = ['🥇','🥈','🥉'];
  const fmt = v => v === null || v === undefined ? '—' : v.toFixed(1);

  tbody.innerHTML = rows.map((r, i) => {
    const fin = i < 4;
    const med = medals[i] ?? (i + 1);
    return `<tr class="${fin ? 'finalist-tr' : ''}">
      <td><span class="medal">${med}</span></td>
      <td class="name-td">${r.name}</td>
      <td>${r.sub.toFixed(1)}</td>
      <td>${r.car.toFixed(2)}</td>
      <td>${fmt(r.f1)}</td>
      <td>${fmt(r.f2)}</td>
      <td>${r.tot.toFixed(2)}</td>
    </tr>`;
  }).join('');
}

// ── Render: Chart ──────────────────────────────────────────────
function renderChart(data) {
  // 実施済みゲームのみ使用
  const done       = completedGames(data.gameRows);
  const playedRows = data.gameRows.slice(0, done);
  const playerCount = data.names.length;
  const cumulative  = Array.from({length: playerCount}, () => [0]);

  for (const g of playedRows) {
    for (let p = 0; p < playerCount; p++) {
      const prev  = cumulative[p].at(-1);
      const v     = g.cells[p];
      const score = (v !== '' && !isNaN(Number(v))) ? parseFloat(v) : 0;
      cumulative[p].push(prev + score);
    }
  }

  const gameCount = playedRows.length;
  const labels    = ['', ...playedRows.map(g => `G${g.gameNum}`)];
  const datasets  = data.names.map((name, i) => ({
    label:           name,
    data:            cumulative[i],
    borderColor:     COLORS[i % COLORS.length],
    backgroundColor: 'transparent',
    borderWidth: 2,
    pointRadius: gameCount <= 10 ? 3 : 2,
    tension: 0.2,
  }));

  if (chartInst) chartInst.destroy();
  chartInst = new Chart(document.getElementById('scoreChart'), {
    type: 'line',
    data: { labels, datasets },
    options: {
      responsive: true,
      animation: false,
      plugins: {
        legend: { position: 'top', labels: { color: '#ccc', boxWidth: 12, font: { size: 11 } } },
        tooltip: { callbacks: { label: ctx => ` ${ctx.dataset.label}: ${ctx.parsed.y.toFixed(1)}` } }
      },
      scales: {
        x: { ticks: { color: '#999', font: {size:11} }, grid: { color: 'rgba(255,255,255,.06)' } },
        y: { ticks: { color: '#999', font: {size:11} }, grid: { color: 'rgba(255,255,255,.06)' } }
      }
    }
  });
}

// ── Main load ──────────────────────────────────────────────────
async function loadAll() {
  const btn    = document.getElementById('btn-refresh');
  const status = document.getElementById('status-bar');
  btn.disabled = true;
  status.className = 'status-bar';
  status.textContent = '読み込み中…';

  try {
    const url = CSV_BASE + '&_=' + Date.now();
    const res = await fetch(url);
    if (!res.ok) throw new Error(`HTTP ${res.status}`);
    const text = await res.text();
    const rows = parseCSV(text);
    const data = extractData(rows);

    if (!data) throw new Error('データ構造を認識できませんでした。シートの構成を確認してください。');

    renderRawTable(rows);
    renderNextGame(data);
    renderStandings(data);
    renderChart(data);

    const done = completedGames(data.gameRows);
    status.textContent = `予選 ${done} / 18 試合完了`;
  } catch (e) {
    status.className = 'status-bar err';
    status.textContent = `取得エラー: ${e.message}`;
    console.error(e);
  } finally {
    btn.disabled = false;
  }
}

loadAll();
</script>
</body>
</html>
