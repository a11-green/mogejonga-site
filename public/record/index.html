<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>mogejonga — 記録</title>
  <link rel="stylesheet" href="../css/layout.css">
  <style>
    .record-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 10px 16px;
      border-bottom: 1px solid rgba(255,255,255,0.08);
    }

    .record-title {
      font-size: 1rem;
      font-weight: bold;
      color: rgba(255,200,50,0.9);
    }

    .btn-open {
      display: inline-flex;
      align-items: center;
      gap: 5px;
      padding: 6px 12px;
      background: rgba(255,255,255,0.07);
      border: 1px solid rgba(255,255,255,0.15);
      border-radius: 6px;
      color: #ccc;
      text-decoration: none;
      font-size: 0.8rem;
      white-space: nowrap;
    }

    .btn-open:hover {
      background: rgba(255,255,255,0.12);
      color: #fff;
    }

    .sheet-wrap {
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
      display: flex;
      flex-direction: column;
    }

    /* push content below the site header */
    .sheet-body {
      flex: 1;
      display: flex;
      flex-direction: column;
      overflow: hidden;
      /* header height offset handled by padding-top on sheet-wrap */
    }

    .sheet-frame {
      width: 100%;
      flex: 1;
      border: none;
      background: #fff;
    }
  </style>
</head>
<body>
  <!-- site nav -->
  <div class="header">
    <header>
      <ul class="header-list">
        <li><a href="../index.html"            class="link-to">Home</a></li>
        <li><a href="../data/index.html"       class="link-to">Data</a></li>
        <li><a href="../stats/index.html"      class="link-to">Stats</a></li>
        <li><a href="../ranking/index.html"    class="link-to">Ranking</a></li>
        <li><a href="../player/index.html"     class="link-to">Player</a></li>
        <li><a href="./index.html"             class="link-now">Record</a></li>
        <li><a href="../regulation/index.html" class="link-to">Regulation</a></li>
      </ul>
    </header>
  </div>

  <!-- sub-header with open link -->
  <div class="record-header">
    <span class="record-title">当日成績表</span>
    <a class="btn-open"
       href="https://docs.google.com/spreadsheets/d/e/2PACX-1vSZ69WloYBrOHN0GNp1ykLBcCFT9QzoAopfbnDPBCKEuuwRhYdcLGWLqSRj_SM1rFW6LybmUm4pc35o/pubhtml"
       target="_blank" rel="noopener">
      ↗ 別タブで開く
    </a>
  </div>

  <!-- spreadsheet embed -->
  <iframe
    class="sheet-frame"
    src="https://docs.google.com/spreadsheets/d/e/2PACX-1vSZ69WloYBrOHN0GNp1ykLBcCFT9QzoAopfbnDPBCKEuuwRhYdcLGWLqSRj_SM1rFW6LybmUm4pc35o/pubhtml?widget=false&headers=false"
    title="当日成績表"
    loading="lazy"
    sandbox="allow-scripts allow-same-origin allow-popups">
  </iframe>

  <script>
    // Fill remaining viewport height below nav + sub-header
    function resizeFrame() {
      const nav    = document.querySelector('.header');
      const subHdr = document.querySelector('.record-header');
      const frame  = document.querySelector('.sheet-frame');
      const used   = nav.offsetHeight + subHdr.offsetHeight;
      frame.style.height = (window.innerHeight - used) + 'px';
    }
    resizeFrame();
    window.addEventListener('resize', resizeFrame);
  </script>
</body>
</html>
