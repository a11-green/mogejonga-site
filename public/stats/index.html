<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <title>mogejonga - Stats</title>
  <link rel="stylesheet" href="../css/layout.css">
  <style>
    .loading {
      padding: 20px;
      font-size: 1.2em;
      color: #ccc;
    }
    .error {
      padding: 20px;
      color: #f88;
    }
    .table_stats th, .table_stats td {
      text-align: right;
      min-width: 60px;
    }
    .table_stats th:first-child, .table_stats td:first-child {
      text-align: left;
    }
    .total-row td {
      font-weight: bold;
      border-top: 2px solid #fff;
    }
    #tbl-matchup-pt th, #tbl-matchup-pt td,
    #tbl-matchup-rnk th, #tbl-matchup-rnk td {
      min-width: 52px;
      font-size: 0.88em;
      padding: 8px 12px;
    }
  </style>
</head>
<body>
  <div class="header">
    <header>
      <ul class="header-list">
        <li><a href="../index.html"            class="link-to">Home</a></li>
        <li><a href="../data/index.html"       class="link-to">Data</a></li>
        <li><a href="./index.html"             class="link-now">Stats</a></li>
        <li><a href="../regulation/index.html" class="link-to">Regulation</a></li>
      </ul>
    </header>
  </div>

  <div class="contents">
    <h1>Stats</h1>
    <div id="loading" class="loading">データを読み込み中...</div>
    <div id="error" class="error" style="display:none;"></div>

    <div id="stats-content" style="display:none;">

      <h2>歴代優勝者</h2>
      <p style="color:#aaa; font-size:0.85em;">Q+SF合計上位4名が決勝進出。持越し（Q+SF合計÷2）＋決勝ポイントで最終順位決定。</p>
      <div style="overflow-x:auto;">
        <table id="tbl-champions" class="table_stats"></table>
      </div>

      <div id="status-filter" style="margin-top:36px; margin-bottom:4px; display:flex; align-items:center; gap:16px; flex-wrap:wrap;">
        <span style="color:#aaa; font-size:0.85em;">集計対象：</span>
        <label style="color:#ccc; font-size:0.9em; cursor:pointer; display:flex; align-items:center; gap:5px;">
          <input type="checkbox" id="chk-Q"  checked> 予選 (Q)
        </label>
        <label style="color:#ccc; font-size:0.9em; cursor:pointer; display:flex; align-items:center; gap:5px;">
          <input type="checkbox" id="chk-SF" checked> セミファイナル (SF)
        </label>
        <label style="color:#ccc; font-size:0.9em; cursor:pointer; display:flex; align-items:center; gap:5px;">
          <input type="checkbox" id="chk-F"> 決勝 (F)
        </label>
      </div>

      <h2 style="margin-top:20px;">累計得点</h2>
      <p style="color:#aaa; font-size:0.85em;">選択したステータス（予選、セミファイナル、決勝）のpoint合計。NaN=不参加。</p>
      <div style="overflow-x:auto;">
        <table id="tbl-points" class="table_stats"></table>
      </div>

      <h2 style="margin-top:40px;">着順分布</h2>
      <p style="color:#aaa; font-size:0.85em;">選択したステータス（予選、セミファイナル、決勝）の1〜4位回数と平均着順（昇順）。</p>
      <div style="overflow-x:auto;">
        <table id="tbl-ranks" class="table_stats"></table>
      </div>

      <h2 style="margin-top:40px;">同卓時得点</h2>
      <p style="color:#aaa; font-size:0.85em;">行プレイヤーが列プレイヤーと同卓だったゲームの得点合計。</p>
      <div style="overflow-x:auto;">
        <table id="tbl-matchup-pt" class="table_stats"></table>
      </div>

      <h2 style="margin-top:40px;">同卓時平均着順</h2>
      <p style="color:#aaa; font-size:0.85em;">行プレイヤーが列プレイヤーと同卓だったゲームの平均着順。</p>
      <div style="overflow-x:auto;">
        <table id="tbl-matchup-rnk" class="table_stats"></table>
      </div>

    </div>
  </div>

  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore-compat.js"></script>

  <script>
    const firebaseConfig = {
      apiKey:            "AIzaSyAmCR3LPPTbwaGaZklCyvNpX-1ZrqN9dGg",
      authDomain:        "mogejonga-site.firebaseapp.com",
      projectId:         "mogejonga-site",
      storageBucket:     "mogejonga-site.firebasestorage.app",
      messagingSenderId: "544731021968",
      appId:             "1:544731021968:web:548739d70cf3c790c8ce15",
    };

    const CACHE_VERSION = "20000101000000"; // auto-updated by addCSV.js
    const CACHE_KEY = "gameResult_v" + CACHE_VERSION;

    const YEAR_ORDER = [
      "2016","2017","2018","2019","2020","2021",
      "202205","202212","2023","202406","202412","2025",
    ];

    firebase.initializeApp(firebaseConfig);
    const db = firebase.firestore();

    let _allRecords = [];
    let _years = [];

    async function main() {
      try {
        // 古いバージョンのキャッシュを削除
        for (const key of Object.keys(localStorage)) {
          if (key.startsWith("gameResult_v") && key !== CACHE_KEY) {
            localStorage.removeItem(key);
          }
        }

        const cached = localStorage.getItem(CACHE_KEY);
        if (cached) {
          _allRecords = JSON.parse(cached);
        } else {
          const snapshot = await db.collection("gameResult").get();
          _allRecords = snapshot.docs.map(d => d.data());
          try {
            localStorage.setItem(CACHE_KEY, JSON.stringify(_allRecords));
          } catch (e) {
            // localStorage容量超過時はキャッシュせず続行
          }
        }

        if (_allRecords.length === 0) {
          showError("Firestoreにデータがありません。addCSV.js でインポートしてください。");
          return;
        }

        const yearsInData = new Set(_allRecords.map(r => r.year));
        _years = YEAR_ORDER.filter(y => yearsInData.has(y));

        buildChampionsTable(_allRecords, _years);
        renderFilteredTables();

        document.getElementById("loading").style.display = "none";
        document.getElementById("stats-content").style.display = "block";

        ["chk-Q", "chk-SF", "chk-F"].forEach(id => {
          document.getElementById(id).addEventListener("change", renderFilteredTables);
        });

      } catch (err) {
        showError("Firestore取得エラー: " + err.message);
      }
    }

    function renderFilteredTables() {
      const statuses = new Set();
      if (document.getElementById("chk-Q").checked)  statuses.add("Q");
      if (document.getElementById("chk-SF").checked) statuses.add("SF");
      if (document.getElementById("chk-F").checked)  statuses.add("F");

      const filtered = _allRecords.filter(r => statuses.has(r.status));

      document.getElementById("tbl-points").innerHTML      = "";
      document.getElementById("tbl-ranks").innerHTML       = "";
      document.getElementById("tbl-matchup-pt").innerHTML  = "";
      document.getElementById("tbl-matchup-rnk").innerHTML = "";

      if (filtered.length === 0) return;

      const playerGameCount = {};
      for (const r of filtered) {
        playerGameCount[r.name] = (playerGameCount[r.name] || 0) + 1;
      }
      const players = Object.keys(playerGameCount)
        .sort((a, b) => playerGameCount[b] - playerGameCount[a]);

      buildPointsTable(filtered, _years, players);
      buildRanksTable(filtered, players);
      buildMatchupTables(filtered, players);
    }

    function buildMatchupTables(records, players) {
      // Group records by (year, game, groups) — each table instance
      const tableMap = {};
      for (const r of records) {
        const key = `${r.year}_${r.game}_${r.groups}`;
        if (!tableMap[key]) tableMap[key] = [];
        tableMap[key].push(r);
      }

      // Compute pairwise point sum and rank for (row player, col player)
      const ptMap  = {}; // ptMap[row][col]  = total points of row when co-playing with col
      const rnkMap = {}; // rnkMap[row][col] = { sum, count }

      for (const group of Object.values(tableMap)) {
        for (const r of group) {
          for (const q of group) {
            if (r.name === q.name) continue;
            if (!ptMap[r.name])           ptMap[r.name]           = {};
            if (!rnkMap[r.name])          rnkMap[r.name]          = {};
            ptMap[r.name][q.name]  = (ptMap[r.name][q.name]  || 0) + r.point;
            if (!rnkMap[r.name][q.name])  rnkMap[r.name][q.name]  = { sum: 0, count: 0 };
            rnkMap[r.name][q.name].sum   += r.rank;
            rnkMap[r.name][q.name].count += 1;
          }
        }
      }

      _buildMatchupTable(
        document.getElementById("tbl-matchup-pt"),
        players,
        (row, col) => {
          if (row === col) return { text: "—", color: null };
          const v = ptMap[row]?.[col];
          if (v === undefined) return { text: "—", color: null };
          return {
            text: (v > 0 ? "+" : "") + v.toFixed(1),
            color: v > 0 ? "#7fc97f" : v < 0 ? "#f88070" : null,
          };
        }
      );

      _buildMatchupTable(
        document.getElementById("tbl-matchup-rnk"),
        players,
        (row, col) => {
          if (row === col) return { text: "—", color: null };
          const d = rnkMap[row]?.[col];
          if (!d || d.count === 0) return { text: "—", color: null };
          const avg = d.sum / d.count;
          return {
            text: avg.toFixed(2),
            color: avg < 2.5 ? "#7fc97f" : avg > 2.5 ? "#f88070" : null,
          };
        }
      );
    }

    function _buildMatchupTable(table, players, cellFn) {
      const thead = table.createTHead();
      const hrow  = thead.insertRow();
      th(hrow, "");
      for (const p of players) th(hrow, p);

      const tbody = table.createTBody();
      for (const row of players) {
        const tr = tbody.insertRow();
        td(tr, row, true);
        for (const col of players) {
          const { text, color } = cellFn(row, col);
          const cell = tr.insertCell();
          cell.textContent  = text;
          cell.style.textAlign = "right";
          if (color) cell.style.color = color;
        }
      }
    }

    function computeChampions(allRecords, years) {
      const qsfMap = {};
      const fMap   = {};

      for (const r of allRecords) {
        if (r.status === "Q" || r.status === "SF") {
          if (!qsfMap[r.year]) qsfMap[r.year] = {};
          qsfMap[r.year][r.name] = (qsfMap[r.year][r.name] || 0) + r.point;
        } else if (r.status === "F") {
          if (!fMap[r.year]) fMap[r.year] = {};
          fMap[r.year][r.name] = (fMap[r.year][r.name] || 0) + r.point;
        }
      }

      const results = {};
      for (const year of years) {
        const qsf = qsfMap[year] || {};
        const f   = fMap[year]   || {};
        const hasF = Object.keys(f).length > 0;

        const top4 = Object.entries(qsf)
          .sort((a, b) => b[1] - a[1])
          .slice(0, 4)
          .map(([name, qsfTotal]) => {
            const carryOver = qsfTotal / 2;
            const fPoints   = f[name] || 0;
            return { name, qsfTotal, carryOver, fPoints, total: carryOver + fPoints };
          });

        if (hasF) top4.sort((a, b) => b.total - a.total);

        results[year] = { finalists: top4, hasF };
      }
      return results;
    }

    function buildChampionsTable(allRecords, years) {
      const champions = computeChampions(allRecords, years);
      const table = document.getElementById("tbl-champions");

      const thead = table.createTHead();
      const hrow  = thead.insertRow();
      th(hrow, "年");
      th(hrow, "優勝");
      th(hrow, "2位");
      th(hrow, "3位");
      th(hrow, "4位");

      const tbody = table.createTBody();
      for (const year of years) {
        const { finalists, hasF } = champions[year] || { finalists: [], hasF: false };
        const row = tbody.insertRow();
        td(row, year, true);

        if (finalists.length === 0) {
          const cell = row.insertCell();
          cell.colSpan = 4;
          cell.textContent = "データなし";
          cell.style.textAlign = "center";
          cell.style.color = "#888";
          continue;
        }

        if (!hasF) {
          // No final round — show top Q/SF players without final total
          for (let i = 0; i < 4; i++) {
            const f = finalists[i];
            const cell = row.insertCell();
            if (f) {
              cell.textContent = `${f.name} (${f.qsfTotal.toFixed(1)})`;
              if (i === 0) cell.style.color = "#ffd700";
            } else {
              cell.textContent = "—";
              cell.style.color = "#888";
            }
            cell.style.textAlign = "right";
          }
        } else {
          for (let i = 0; i < 4; i++) {
            const f = finalists[i];
            const cell = row.insertCell();
            if (f) {
              cell.textContent = `${f.name} (${f.total.toFixed(1)})`;
              if (i === 0) cell.style.color = "#ffd700";
            } else {
              cell.textContent = "—";
              cell.style.color = "#888";
            }
            cell.style.textAlign = "right";
          }
        }
      }
    }

    function buildPointsTable(records, years, players) {
      const pointMap = {};
      for (const r of records) {
        if (!pointMap[r.year]) pointMap[r.year] = {};
        pointMap[r.year][r.name] = ((pointMap[r.year][r.name] || 0) + r.point);
      }

      const table = document.getElementById("tbl-points");
      const thead = table.createTHead();
      const hrow = thead.insertRow();
      th(hrow, "year");
      for (const p of players) th(hrow, p);

      const tbody = table.createTBody();
      const playerTotal = {};
      for (const year of years) {
        const row = tbody.insertRow();
        td(row, year, true);
        for (const p of players) {
          const val = pointMap[year]?.[p];
          const cell = td(row, val !== undefined ? val.toFixed(1) : "—");
          if (val !== undefined) {
            cell.style.color = val > 0 ? "#7fc97f" : val < 0 ? "#f88070" : "";
            playerTotal[p] = (playerTotal[p] || 0) + val;
          }
        }
      }

      const totalRow = tbody.insertRow();
      totalRow.classList.add("total-row");
      td(totalRow, "Total", true);
      for (const p of players) {
        const v = playerTotal[p];
        const cell = td(totalRow, v !== undefined ? v.toFixed(1) : "—");
        if (v !== undefined) {
          cell.style.color = v > 0 ? "#7fc97f" : v < 0 ? "#f88070" : "";
        }
      }
    }

    function buildRanksTable(records, players) {
      const rankMap = {};
      for (const r of records) {
        if (!rankMap[r.name]) rankMap[r.name] = { 1:0, 2:0, 3:0, 4:0, sum:0, count:0 };
        const ri = Math.round(r.rank);
        if (ri >= 1 && ri <= 4) {
          rankMap[r.name][ri]++;
          rankMap[r.name].sum += ri;
          rankMap[r.name].count++;
        }
      }

      const table = document.getElementById("tbl-ranks");
      const thead = table.createTHead();
      const hrow = thead.insertRow();
      th(hrow, "");
      th(hrow, "対局数");
      th(hrow, "1位");
      th(hrow, "2位");
      th(hrow, "3位");
      th(hrow, "4位");
      th(hrow, "平均着順");

      const sorted = players
        .map(p => {
          const d = rankMap[p] || { 1:0, 2:0, 3:0, 4:0, sum:0, count:0 };
          const avg = d.count > 0 ? d.sum / d.count : Infinity;
          return { p, d, avg };
        })
        .sort((a, b) => a.avg - b.avg);

      const tbody = table.createTBody();
      for (const { p, d, avg } of sorted) {
        const row = tbody.insertRow();
        td(row, p, true);
        td(row, d.count);
        td(row, d[1]);
        td(row, d[2]);
        td(row, d[3]);
        td(row, d[4]);
        const avgCell = td(row, avg === Infinity ? "—" : avg.toFixed(2));
        if (avg !== Infinity) {
          avgCell.style.color = avg < 2.5 ? "#7fc97f" : avg > 2.5 ? "#f88070" : "";
        }
      }
    }

    function th(row, text) {
      const cell = document.createElement("th");
      cell.textContent = text;
      row.appendChild(cell);
    }
    function td(row, text, isHeader = false) {
      const cell = document.createElement(isHeader ? "th" : "td");
      cell.textContent = text;
      row.appendChild(cell);
      return cell;
    }
    function showError(msg) {
      document.getElementById("loading").style.display = "none";
      const el = document.getElementById("error");
      el.textContent = msg;
      el.style.display = "block";
    }

    main();
  </script>
</body>
</html>
